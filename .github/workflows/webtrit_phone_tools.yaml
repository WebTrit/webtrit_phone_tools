name: webtrit_phone_tools

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/webtrit_phone_tools.yaml"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "docs/**"
      - "*.md"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/webtrit_phone_tools.yaml"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  # The documentation is checked the way the code is: a link that no longer
  # resolves, a page nothing leads to, or a path named in prose that is not
  # there fails the pull request that introduced it.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart run tool/docs_gate.dart

  # One path dependency survives: `webtrit_appearance_theme`, which the theme
  # step reads to decide light and dark. It lives in the phone repository,
  # which is public, so the job simply lays it out beside this one - no
  # credentials anywhere in the checks.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webtrit_phone_tools
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          path: webtrit_phone_tools

      - name: 📚 Checkout sibling webtrit_phone
        uses: actions/checkout@v4
        with:
          repository: WebTrit/webtrit_phone
          ref: develop
          path: webtrit_phone

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: ✨ Check Formatting
        run: dart format --line-length 120 --set-exit-if-changed bin lib test

      - name: 🕵️ Analyze
        run: dart analyze --fatal-warnings

      - name: 🧪 Run Tests
        run: dart test

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !brick/**/*.md
        .*/**/*.md
      modified_files_only: false

  verify-version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webtrit_phone_tools
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          path: webtrit_phone_tools

      - name: 📚 Checkout sibling webtrit_phone
        uses: actions/checkout@v4
        with:
          repository: WebTrit/webtrit_phone
          ref: develop
          path: webtrit_phone

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "stable"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🔎 Verify version
        run: dart run test --run-skipped -t version-verify
